# Backend no Render com Neon externo. Migrations são executadas pelo workflow
# isolado `migrar_banco.yml`, antes do código dependente do schema.
services:
  - type: web
    name: sieo-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install 'uv==0.12.17' && uv sync --frozen
    startCommand: uv run sh ./start-server.sh
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      # A UI fala com a API por "/api" (proxy same-origin do Vercel, ver
      # frontend/vercel.json) -- o cookie de refresh so' e reenviado se o
      # Path bater com o que o BROWSER contata, nao com a rota que o
      # backend recebe (rewrite reescreve so' no destino). Achado ao vivo
      # 2026-09-28: sem isso a renovacao de sessao falhava com 401 sempre.
      - key: REFRESH_COOKIE_PATH
        value: /api/auth
      - key: NEW_RELIC_LICENSE_KEY
        sync: false
      - key: NEW_RELIC_APP_NAME
        value: SIGEO API
      - key: NEW_RELIC_LOG
        value: stdout
      - key: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
        value: "true"
      # O agente encaminha somente os registros já emitidos pela aplicação;
      # não habilitar context data, para não ampliar os atributos enviados.
      - key: NEW_RELIC_APPLICATION_LOGGING_ENABLED
        value: "true"
      - key: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
        value: "true"
      - key: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_MAX_SAMPLES_STORED
        value: "1000"

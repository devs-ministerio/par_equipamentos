# Backend no Render com Neon externo. Migrations são executadas pelo workflow
# isolado `migrar_banco.yml`, antes do código dependente do schema.
services:
  - type: web
    name: sieo-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install 'uv==0.12.17' && uv sync --frozen
    startCommand: uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

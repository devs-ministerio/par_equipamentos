# Backend no Render com Neon externo. Migrations são executadas pelo workflow
# isolado `migrar_banco.yml`, antes do código dependente do schema.
services:
  - type: web
    name: sieo-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install 'uv==0.12.17' && uv sync --frozen
    startCommand: uv run sh ./start-server.sh
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: NEW_RELIC_LICENSE_KEY
        sync: false
      - key: NEW_RELIC_APP_NAME
        value: SIGEO API
      - key: NEW_RELIC_LOG
        value: stdout
      - key: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
        value: "true"

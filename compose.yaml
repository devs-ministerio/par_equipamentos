services:
  postgres:
    image: postgres:16.9-alpine
    env_file: backend/.env.orbstack
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["sigeo-postgres:/var/lib/postgresql/data"]
  backend:
    build:
      context: backend
    env_file: backend/.env.orbstack
    depends_on:
      postgres:
        condition: service_healthy
    ports: ["8000:8000"]

volumes:
  sigeo-postgres:

name: Frontend CI

# Etapa 11 do plan-mode frontend (2026-09-17) -- gate automático de
# lint/typecheck/test/build a cada push/PR que toque frontend/. `npm ci`
# (não `npm install`) trava a instalação no que o lockfile já tem --
# lockfile desalinhado falha o job em vez de silenciosamente instalar
# outra versão.
on:
  push:
    branches: [master]
    paths: ["frontend/**", ".github/workflows/frontend_ci.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend_ci.yml"]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_e_testes:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências (lockfile travado)
        run: npm ci

      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm run test

      - name: Build
        run: npm run build

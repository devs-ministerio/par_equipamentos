name: Pipelines de dados (Tomógrafo, Ressonância e PET-CT)

# Para suspender o agendamento: ATUALIZACOES_PIPELINES_ATIVAS=false.
on:
  schedule:
    - cron: "0 9 * * *" # 06:00 Brasília
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rodar_pipelines:
    if: github.event_name == 'workflow_dispatch' || vars.ATUALIZACOES_PIPELINES_ATIVAS == 'true'
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 90
    concurrency:
      group: sigeo-production-database
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ATUALIZACOES_PRODUCAO: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Exige credencial runtime
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL ausente no environment Production." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Instala dependências travadas
        run: uv sync --frozen
      - name: Pré-voo de schema, destino e permissões runtime
        id: preflight
        run: uv run python -m scripts.atualizar_dados_producao preflight
      - name: Garante referência ANS sem substituir a referência ativa
        id: populacao
        run: uv run python -m scripts.atualizar_dados_producao populacao
      - name: Atualiza Tomógrafo
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.populacao.outcome == 'success' }}
        run: uv run python -m scripts.atualizar_dados_producao tomografo
      - name: Atualiza Ressonância
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.populacao.outcome == 'success' }}
        run: uv run python -m scripts.atualizar_dados_producao ressonancia
      - name: Atualiza PET-CT
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.populacao.outcome == 'success' }}
        run: uv run python -m scripts.atualizar_dados_producao pet-ct

name: Pipelines de dado (TOMOGRAFO / RESSONANCIA)

# So manual por enquanto (Run workflow) -- o "schedule:" fica comentado
# de proposito: projeto ainda so roda local (2026-08-24), sem Postgres em
# producao alcancavel pelos runners do GitHub. Um cron diario contra
# banco nenhum so geraria falha automatica (e notificacao de e-mail) todo
# dia. Reativar o cron abaixo quando o deploy (Railway ou outro) e o
# secret DATABASE_URL apontando pra URL PUBLICA do banco existirem.
#
# on:
#   schedule:
#     - cron: "0 9 * * *"  # 09:00 UTC = 06:00 em Brasilia
on:
  workflow_dispatch: {}

jobs:
  rodar_pipelines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      # `secrets` nao pode ser referenciado em `jobs.<id>.if` (o GitHub
      # rejeita o workflow inteiro com "Unrecognized named-value: secrets" --
      # erro real encontrado 2026-08-24, so e permitido em `if:` de STEP).
      # Por isso o guard vira um step normal, que grava um output pros
      # steps seguintes lerem.
      - name: Verifica se o secret DATABASE_URL existe
        id: guard
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Secret DATABASE_URL nao configurado (Settings > Secrets and variables > Actions) -- pulando o resto do job."
            echo "tem_secret=false" >> "$GITHUB_OUTPUT"
          else
            echo "tem_secret=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.tem_secret == 'true'

      - uses: astral-sh/setup-uv@v3
        if: steps.guard.outputs.tem_secret == 'true'
        with:
          version: "latest"

      - name: Instala dependencias
        if: steps.guard.outputs.tem_secret == 'true'
        run: uv sync --frozen

      - name: Aplica migrations pendentes
        if: steps.guard.outputs.tem_secret == 'true'
        run: uv run alembic upgrade head

      - name: Roda pipeline TOMOGRAFO
        if: steps.guard.outputs.tem_secret == 'true'
        run: uv run python -m scripts.run_pipeline_tomografo

      - name: Roda pipeline RESSONANCIA
        # sempre tenta, mesmo se TOMOGRAFO falhar -- cada run() ja registra
        # a propria falha em AuditLog (app/pipeline/runner.py) antes de
        # relancar a excecao. So nao roda se o guard inicial ja bloqueou tudo.
        if: always() && steps.guard.outputs.tem_secret == 'true'
        run: uv run python -m scripts.run_pipeline_ressonancia

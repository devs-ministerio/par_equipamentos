name: SBOM e segurança da imagem

on:
  push:
    branches: [master]
    paths: ["backend/**", ".github/workflows/supply_chain.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/supply_chain.yml"]

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  imagem:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir imagem do backend
        run: docker build --tag sigeo-backend-ci:${{ github.sha }} backend
      - name: Exportar artefato imutável da imagem
        run: docker save sigeo-backend-ci:${{ github.sha }} | gzip --stdout > sigeo-backend-${{ github.sha }}.tar.gz
      - name: Publicar artefato de imagem por SHA
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sigeo-backend-image-${{ github.sha }}
          path: sigeo-backend-${{ github.sha }}.tar.gz
          if-no-files-found: error
          # 3 dias (não 30): tarball de ~260MB por push, só usado dentro deste
          # mesmo job pra scan de CVE -- nunca consumido depois. Retenção
          # longa aqui foi o que esgotou a cota de armazenamento de Actions
          # do repo privado (500MB no plano Free), achado 2026-09-28. SBOM
          # (linha abaixo, ~350KB) continua 30 dias -- é o que vale manter
          # pra auditoria.
          retention-days: 3
      - name: Gerar SBOM SPDX da imagem
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: sigeo-backend-ci:${{ github.sha }}
          format: spdx-json
          artifact-name: sigeo-backend-sbom-${{ github.sha }}
          upload-artifact-retention: 30
          upload-release-assets: false
          dependency-snapshot: false
      - name: Bloquear CVE crítico na imagem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sigeo-backend-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: false

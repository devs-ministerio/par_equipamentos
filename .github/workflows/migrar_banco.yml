name: Migrar banco (alembic upgrade head)

# Plan Mode database 2026-09-16/17, Bloco 4: fluxo protegido e isolado pra
# aplicar migration -- desacoplado do boot da API (render.yaml) e dos jobs
# de dado (pipelines.yml/radar_convenios.yml), que so precisam de DML e
# rodam com o role `sigeo_runtime`. Este workflow usa uma credencial
# separada (`DATABASE_URL_MIGRATION`, role `sigeo_migration`, dono do
# schema) e so dispara manualmente -- uma ref nao validada nunca aplica DDL
# sozinha. Rodar SEMPRE antes de qualquer deploy/job que dependa de coluna
# ou tabela nova.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  migrar:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 20
    concurrency:
      group: sigeo-production-database
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_MIGRATION }}
      # Alembic importa Settings, que valida JWT_SECRET mesmo sem iniciar a
      # aplicação. Este valor é deliberadamente inerte: o job só executa DDL
      # e nunca assina nem valida tokens.
      JWT_SECRET: migration-only-config-validation-placeholder-at-least-32
    steps:
      - name: Exige o secret DATABASE_URL_MIGRATION
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL_MIGRATION ausente no environment Production." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Instala dependencias
        run: uv sync --frozen

      - name: Mostra revision atual
        run: uv run alembic current

      - name: Aplica migrations pendentes
        run: uv run alembic upgrade head

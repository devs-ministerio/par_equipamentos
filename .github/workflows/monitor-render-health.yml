name: Monitorar saúde do Render

# Mitigação temporária enquanto a API estiver no plano Free do Render. A cada
# cinco minutos, uma chamada pública acorda ou mantém ativa a instância. Não é
# garantia de disponibilidade: GitHub pode atrasar execuções agendadas e a
# estratégia deve sair quando a API migrar para Railway.
on:
  schedule:
    - cron: "7-57/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sigeo-render-health-monitor
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Consultar saúde pública da API
        run: >-
          curl --fail --silent --show-error
          --retry 3 --retry-all-errors --retry-delay 5
          --connect-timeout 10 --max-time 70
          https://sieo-backend.onrender.com/health

name: Radar e atualização das fontes oficiais

# Para suspender o agendamento: ATUALIZACOES_RADAR_ATIVAS=false.
on:
  schedule:
    - cron: "30 9 * * *" # 06:30 Brasília
  workflow_dispatch:
    inputs:
      tarefa:
        description: Fonte a executar (as demais não serão repetidas)
        type: choice
        required: true
        default: todas
        options: [todas, descoberta-transferegov, siconv, transferegov, descoberta-siconv, vigencia]

permissions:
  contents: read

jobs:
  radar_convenios:
    if: github.event_name == 'workflow_dispatch' || vars.ATUALIZACOES_RADAR_ATIVAS == 'true'
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 120
    concurrency:
      group: sigeo-production-database
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
      ATUALIZACOES_PRODUCAO: "true"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Exige credenciais de produção
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$PORTAL_TRANSPARENCIA_API_KEY" ]; then
            echo "Credencial runtime ou chave do Portal ausente no environment Production." >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Instala dependências travadas
        run: uv sync --frozen
      - name: Pré-voo de schema, destino e permissões runtime
        id: preflight
        run: uv run python -m scripts.atualizar_dados_producao preflight
      - name: Descoberta TransfereGov
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && (github.event_name == 'schedule' || inputs.tarefa == 'todas' || inputs.tarefa == 'descoberta-transferegov') }}
        run: uv run python -m scripts.atualizar_dados_producao descoberta-transferegov
      - name: Atualização SICONV dos convênios conhecidos
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && (github.event_name == 'schedule' || inputs.tarefa == 'todas' || inputs.tarefa == 'siconv') }}
        run: uv run python -m scripts.atualizar_dados_producao siconv
      - name: Atualização TransfereGov das parcerias monitoradas
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && (github.event_name == 'schedule' || inputs.tarefa == 'todas' || inputs.tarefa == 'transferegov') }}
        run: uv run python -m scripts.atualizar_dados_producao transferegov
      - name: Descoberta SICONV e confirmação Portal para o Radar
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && (github.event_name == 'schedule' || inputs.tarefa == 'todas' || inputs.tarefa == 'descoberta-siconv') }}
        run: uv run python -m scripts.atualizar_dados_producao descoberta-siconv
      - name: Alertas de vigência com deduplicação
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && (github.event_name == 'schedule' || inputs.tarefa == 'todas' || inputs.tarefa == 'vigencia') }}
        run: uv run python -m scripts.atualizar_dados_producao vigencia

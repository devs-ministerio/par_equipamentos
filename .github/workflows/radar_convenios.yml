name: Radar de Convênios (descoberta TransfereGov / verificação SICONV / verificação TransfereGov / alerta de vigência)

# So manual por enquanto, mesmo motivo/mesmo guard do pipelines.yml (sem
# DATABASE_URL publico configurado como secret ainda) -- reativar o
# "schedule:" abaixo quando o secret existir. Job de descoberta e pensado
# pra rodar DIARIO (API paginada, sem custo real); job de verificacao roda
# junto mas so reprocessa de fato quando o HEAD-check acusa mudanca real
# no dump SICONV (ver docstring de scripts/job_verificacao_siconv.py) --
# rodar os dois com a mesma cadencia diaria e seguro. Job de alerta de
# vigencia (Plan Mode notificacoes-escopo 2026-09-25) tem dedup proprio
# (DEDUP_DIAS em scripts/job_alerta_vigencia.py) -- tambem seguro rodar
# diario junto dos demais.
#
# Plan Mode database 2026-09-16/17, Bloco 1+4: DATABASE_URL aqui e o role
# `sigeo_runtime` (so DML) -- NAO roda mais 'alembic upgrade head' neste
# job. Migration pendente aplica-se pelo workflow dedicado
# '.github/workflows/migrar_banco.yml', sempre antes de rodar este.
#
# on:
#   schedule:
#     - cron: "30 9 * * *"  # 09:30 UTC = 06:30 em Brasilia (depois do pipelines.yml)
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  radar_convenios:
    runs-on: ubuntu-24.04
    environment: Production
    timeout-minutes: 45
    concurrency:
      group: sigeo-production-database
      cancel-in-progress: false
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Exige o secret DATABASE_URL
        working-directory: .
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL ausente no environment Production." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true

      - name: Instala dependencias
        run: uv sync --frozen

      - name: Job de descoberta -- TransfereGov (novas propostas nos 8 programas-alvo)
        run: uv run python -m scripts.job_descoberta_transferegov

      - name: Job de verificacao -- SICONV legado (situação de convênio já conhecido)
        # sempre tenta, mesmo se a descoberta falhar -- fontes independentes,
        # sem dependencia entre os jobs.
        if: always()
        run: uv run python -m scripts.job_verificacao_siconv

      - name: Job de verificacao -- TransfereGov Novo (situação de parceria/ordem de pagamento)
        if: always()
        run: uv run python -m scripts.job_verificacao_transferegov

      - name: Job de alerta -- fim de vigência a 3 meses
        if: always()
        run: uv run python -m scripts.job_alerta_vigencia

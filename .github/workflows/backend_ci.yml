name: Backend CI e segurança

on:
  push:
    branches: [master]
    paths: ["backend/**", ".github/workflows/backend_ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend_ci.yml"]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.9-alpine
        env:
          POSTGRES_DB: sigeo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d sigeo_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sigeo_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sigeo_test
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      COOKIE_SECURE: "false"
      COOKIE_SAMESITE: lax
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Instalar dependências travadas
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Tipos
        run: uv run mypy .
      - name: Preparar schema PostgreSQL efêmero
        run: uv run alembic upgrade head
      - name: Testes unitários e de integração com cobertura
        run: >-
          uv run pytest --cov --cov-branch --cov-report=term
          --cov-report=json:coverage.json --cov-report=xml:coverage.xml
      - name: Validar pisos de cobertura por camada
        run: uv run python -m scripts.validar_cobertura coverage.json
      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: |
            backend/coverage.json
            backend/coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Auditoria de dependências
        run: uv run --with pip-audit pip-audit

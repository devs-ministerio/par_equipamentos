[tool.mypy]
python_version = "3.12"
# Não habilitamos `strict` de uma vez porque exige revisão de contrato por
# módulo. Corpos não anotados, inclusive dos testes, são verificados: não há
# baseline que oculte erro de tipo.
ignore_missing_imports = true
check_untyped_defs = true

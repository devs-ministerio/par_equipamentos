[project]
name = "sieo-backend"
version = "0.1.0"
description = "API do SIGEO -- cobertura de equipamentos oncologicos por macrorregiao de saude"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "polars>=1.17",
    "fastexcel>=0.21.0",
    "pyjwt>=2.9",
    "openpyxl>=3.1",
    "pyarrow>=25.0.1",
    "pandas>=3.0.5",
    "boto3>=1.43.95",
    "slowapi>=0.1.10",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: testes que exigem TEST_DATABASE_URL apontando para PostgreSQL dedicado de teste",
]

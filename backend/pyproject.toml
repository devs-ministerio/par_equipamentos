[project]
name = "sieo-backend"
version = "0.1.0"
description = "API do SIGEO -- cobertura de equipamentos oncologicos por macrorregiao de saude"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "requests>=2.32",
    "python-dotenv>=1.0",
    "polars>=1.17",
    "fastexcel>=0.21.0",
    "pyjwt>=2.9",
    "openpyxl>=3.1",
    "pyarrow>=25.0.1",
    "pandas>=3.0.5",
    "boto3>=1.43.95",
    "slowapi>=0.1.10",
    "newrelic>=13.6.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "httpx>=0.28",
    "ruff>=0.16.8",
    "mypy>=2.3.1",
    "httpx2>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: testes que exigem TEST_DATABASE_URL apontando para PostgreSQL dedicado de teste",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# So erro/pyflakes/ordem de import por enquanto (Plan Mode backend
# 2026-09-17, Bloco E) -- sem regra de estilo agressiva. As exceções
# históricas estão declaradas abaixo por arquivo, em vez de uma baseline que
# Ruff não lê; migrations novas continuam integralmente verificadas.
select = ["E", "F", "I"]
# Comprimento de linha é formatado progressivamente; não é erro semântico e
# não deve impedir o gate enquanto migrations e scripts históricos são
# migrados em blocos próprios.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Não reformatar migrations já aplicadas apenas para ordenar imports. Esta
# lista é fechada e deliberada: remover um item exige a revisão histórica do
# arquivo; migration nova não entra aqui.
"alembic/env.py" = ["I001"]
"alembic/versions/01a01055b1af_adiciona_bloqueio_de_conta_em_user.py" = ["I001"]
"alembic/versions/26becbd31f95_corrige_escopo_instrumentos_firmados.py" = ["I001"]
